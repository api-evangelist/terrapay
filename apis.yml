name: TerraPay
description: >-
  TerraPay is a global cross-border payments and digital-wallet infrastructure
  company connecting banks, mobile wallets, money-transfer operators, merchants,
  and card networks into a single interoperable network for real-time
  international money movement. Its partner API Suite follows the GSMA Mobile
  Money API, exposing account validation, FX quotations, and multi-rail
  transactions (wallet, bank account, and card) across global remittance
  corridors, with compliance, monitoring, reconciliation, and reporting built
  into the platform. Partners authenticate with signed request headers over
  mutual TLS across Sandbox, UAT, and LIVE environments. Added to the API
  Evangelist network from the Partech portfolio and enriched from TerraPay's
  public developer portal.
